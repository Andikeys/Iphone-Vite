version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  build:
    commands:
      - echo "Building the React (Vite) application..."
      - npm run build

  post_build:
    commands:
      - echo "Build completed. Files are in the dist/ folder"
      - echo "Uploading files to S3..."
      - aws s3 sync dist/ s3://saas-landing-server --delete

artifacts:
  files:
    - '**/*'
  base-directory: dist
